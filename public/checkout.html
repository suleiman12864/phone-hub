<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout — PHONE HUB</title>
    <link rel="stylesheet" href="/src/frontend/css/base.css">
    <link rel="stylesheet" href="/src/frontend/css/layout.css">
    <link rel="stylesheet" href="/src/frontend/css/components.css">
    <link rel="stylesheet" href="/src/frontend/css/admin.css">
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
    <header>
        <a class="logo" href="index.html">PHONE<span>HUB</span></a>
        <a href="index.html" class="btn-icon btn-secondary">← Continue Shopping</a>
    </header>
    <main style="max-width: 760px; margin: 0 auto;">
        <small style="color:var(--accent-gold); font-weight:700;">CHECKOUT</small>
        <h1 style="font-size:36px; font-weight:800; margin: 6px 0 24px;">Complete your order</h1>
        
        <div id="summary"></div>
        
        <form id="form" class="formgrid">
            <label class="full">Full Name *
                <input name="name" placeholder="John Doe" required>
            </label>
            <label>Phone Number *
                <input name="phone" placeholder="08012345678" required>
            </label>
            <label>WhatsApp Number
                <input name="whatsapp" placeholder="08012345678">
            </label>
            <label class="full">Email Address *
                <input name="email" type="email" placeholder="john@example.com" required>
            </label>
            <label class="full">Delivery Address *
                <textarea name="address" rows="3" placeholder="Enter your full street address" required></textarea>
            </label>
            <label>State *
                <input name="state" placeholder="e.g. Lagos" required>
            </label>
            <label class="full">Additional Notes
                <textarea name="note" rows="2" placeholder="Delivery instructions or preference"></textarea>
            </label>

            <!-- Payment Method Notice -->
            <div class="full" style="margin-top:20px;">
                <label style="font-weight:700; display:block; margin-bottom:10px; font-size:16px;">Payment Method</label>
                <div style="border: 1px solid var(--border-color); padding: 16px; border-radius: var(--radius-md); background: var(--bg-surface); display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <b style="display:block; color:var(--text-main);">💳 Online Payment (Paystack)</b>
                        <small class="muted" style="font-size:12px;">Secure payment via Card, Bank Transfer, or USSD</small>
                    </div>
                    <span class="tag" style="background:rgba(46,204,113,0.15); color:#2ecc71; border:1px solid #2ecc71; font-weight:700;">Instant Confirmation</span>
                </div>
            </div>


            <div class="full" style="margin-top:20px;">
                <button id="submitBtn" class="btn full" style="width:100%; padding: 16px;">PAY & PLACE ORDER</button>
            </div>
        </form>
    </main>
    <script type="module" src="/src/frontend/js/checkout-main.js"></script>
</body>

</html>
